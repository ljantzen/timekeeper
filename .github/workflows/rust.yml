name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: "!startsWith(github.event.head_commit.message, 'Bump version')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get install -y libasound2-dev
      - name: Build
        run: cargo build --verbose --release --features tmkpr-pomodoro/audio
      - name: Test
        run: cargo test --workspace --verbose --features tmkpr-pomodoro/audio
